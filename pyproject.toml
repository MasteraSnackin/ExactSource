[project]
name = "exactsource"
version = "0.1.0"
description = "Formula-aware spreadsheet reasoning for SpreadsheetBench."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ExactSource" }]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11,<3",
]

[project.scripts]
exactsource = "exactsource.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exactsource"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["exactsource"]

[tool.coverage.report]
show_missing = true
skip_covered = true
