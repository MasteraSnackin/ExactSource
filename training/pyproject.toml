[project]
name = "exactsource-sft"
version = "0.1.0"
description = "Isolated, reproducible SFT experiments for ExactSource."
requires-python = ">=3.11,<3.14"
dependencies = [
    "exactsource",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "tinker==0.27.1",
    "tinker-cookbook==0.5.7",
    "transformers==5.5.4",
]

[project.scripts]
exactsource-sft = "exactsource_sft.train:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exactsource_sft"]

[tool.uv.sources]
exactsource = { path = "..", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
